# Isolated PostgreSQL for local development of the refactor (forum_dev).
# Persistent volume: development content survives restarts. This is separate
# from docker-compose.yml (legacy local postgres) and from the QNAP NAS.
name: forum-dev

services:
  postgres-dev:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:55433:5432"
    environment:
      POSTGRES_USER: forum
      POSTGRES_PASSWORD: forum
      POSTGRES_DB: forum_dev
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forum -d forum_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_dev_data:
